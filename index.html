<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>开卷 · 回血</title>
<style>
/* ============ 基础 ============ */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root{
  --ink-bg:#f3f3f0; --ink-fg:#262626; --ink-gray:#8b8b87; --ink-line:#dcdcd6; --ink-card:#fbfbf9;
  --br-bg:#faf6ee; --br-fg:#4a3f33; --br-gray:#a2937f; --br-line:#e8dfd0; --br-card:#fffdf8; --br-accent:#c19a6b;
}
html,body{ height:100%; }
body{
  font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg,#f5f5f3); color:var(--fg,#333);
  transition:background .6s,color .6s; overflow-x:hidden;
}
body.line-ink{ --bg:var(--ink-bg); --fg:var(--ink-fg); --gray:var(--ink-gray); --line:var(--ink-line); --card:var(--ink-card);
  font-family:"Kaiti SC","STKaiti","KaiTi","Noto Serif SC",serif; }
body.line-bread{ --bg:var(--br-bg); --fg:var(--br-fg); --gray:var(--br-gray); --line:var(--br-line); --card:var(--br-card); }
body.line-none{ --bg:#f5f5f3; --fg:#333; --gray:#999; --line:#e2e2de; --card:#fff; }
button{ font-family:inherit; cursor:pointer; }
img{ display:block; }

/* ============ 顶栏 ============ */
#topbar{
  position:fixed; top:0; left:0; right:0; z-index:50;
  display:flex; justify-content:space-between; align-items:center;
  padding:18px 28px; pointer-events:none;
}
#topbar .brand{ font-size:14px; letter-spacing:.35em; color:var(--gray); pointer-events:auto; cursor:pointer; user-select:none; }
#muteBtn{
  pointer-events:auto; border:1px solid var(--line); background:transparent; color:var(--gray);
  width:38px; height:38px; border-radius:50%; font-size:16px; transition:.3s;
}
#muteBtn:hover{ border-color:var(--fg); color:var(--fg); }

/* ============ 视图通用 ============ */
.view{ display:none; min-height:100vh; padding:90px 24px 60px; animation:fadeIn .5s ease; }
.view.active{ display:block; }
@keyframes fadeIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;} }
.wrap{ max-width:1060px; margin:0 auto; }
.back-link{
  display:inline-flex; align-items:center; gap:6px; background:none; border:none;
  color:var(--gray); font-size:14px; letter-spacing:.15em; margin-bottom:26px; transition:.3s; padding:4px 0;
}
.back-link:hover{ color:var(--fg); }
.view-title{ font-size:30px; font-weight:500; letter-spacing:.2em; margin-bottom:8px; }
.view-sub{ color:var(--gray); font-size:14px; letter-spacing:.12em; margin-bottom:38px; }

/* ============ 入口页 ============ */
#view-home{ display:none; padding:0; }
#view-home.active{ display:flex; }
.home-split{ display:flex; width:100%; min-height:100vh; }
.home-card{
  flex:1; position:relative; border:none; text-align:left; overflow:hidden;
  display:flex; flex-direction:column; justify-content:flex-end;
  padding:56px 48px; transition:flex 0.6s cubic-bezier(.22,1,.36,1); background:#000;
}
.home-card:hover{ flex:1.35; }
.home-card .bg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:transform 1.2s ease, filter .6s; }
.home-card:hover .bg{ transform:scale(1.05); }
.home-card.ink .bg{ filter:grayscale(1) brightness(.92); }
.home-card.bread .bg{ filter:brightness(.96); }
.home-card .shade{ position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,.45), rgba(0,0,0,0) 55%); }
.home-card.bread .shade{ background:linear-gradient(to top, rgba(74,63,51,.5), rgba(74,63,51,0) 55%); }
.home-card .inner{ position:relative; color:#fff; }
.home-card .zh{ font-size:52px; letter-spacing:.28em; font-weight:500; margin-bottom:10px;
  font-family:inherit; text-shadow:0 2px 18px rgba(0,0,0,.35); }
.home-card.ink .zh{ font-family:"Kaiti SC","STKaiti","KaiTi",serif; }
.home-card .en{ font-size:13px; letter-spacing:.5em; opacity:.85; margin-bottom:16px; }
.home-card .desc{ font-size:14px; letter-spacing:.1em; opacity:.8; line-height:1.8; }
.home-card .arrow{ position:absolute; right:48px; bottom:56px; color:#fff; font-size:22px; opacity:0; transform:translateX(-12px); transition:.4s; }
.home-card:hover .arrow{ opacity:1; transform:none; }
.home-foot{
  position:absolute; left:50%; bottom:22px; transform:translateX(-50%);
  color:rgba(255,255,255,.65); font-size:11px; letter-spacing:.4em; z-index:5; pointer-events:none;
}

/* ============ 列表页 ============ */
.line-head{ position:relative; border:1px solid var(--line); background:var(--card); padding:34px 36px; margin-bottom:36px; overflow:hidden; }
.line-head .head-img{ position:absolute; right:0; top:0; height:100%; width:46%; object-fit:cover; opacity:.5;
  -webkit-mask-image:linear-gradient(to right, transparent, #000 60%); mask-image:linear-gradient(to right, transparent, #000 60%); }
.line-head h2{ font-size:26px; letter-spacing:.25em; font-weight:500; position:relative; }
.line-head p{ color:var(--gray); font-size:13px; letter-spacing:.12em; margin-top:8px; position:relative; }

.section-label{ font-size:13px; letter-spacing:.35em; color:var(--gray); margin:34px 0 16px; }

.task-item{
  display:flex; align-items:center; gap:18px; background:var(--card);
  border:1px solid var(--line); padding:18px 22px; margin-bottom:12px; transition:.3s;
}
.task-item:hover{ border-color:var(--fg); }
.task-item .t-name{ flex:1; font-size:16px; letter-spacing:.06em; }
.task-item .t-min{ color:var(--gray); font-size:13px; letter-spacing:.1em; white-space:nowrap; }
.btn-start{
  border:1px solid var(--fg); background:var(--fg); color:var(--bg);
  padding:8px 22px; font-size:13px; letter-spacing:.2em; transition:.3s;
}
.btn-start:hover{ opacity:.82; }
.btn-del{ border:none; background:none; color:var(--gray); font-size:16px; padding:6px; transition:.3s; }
.btn-del:hover{ color:#b04a3a; }
.empty-tip{ color:var(--gray); font-size:13px; letter-spacing:.15em; padding:26px 0; text-align:center; border:1px dashed var(--line); }

/* 新建表单 */
.new-form{ background:var(--card); border:1px solid var(--line); padding:26px 28px; }
.new-form input[type=text]{
  width:100%; border:none; border-bottom:1px solid var(--line); background:transparent;
  font-family:inherit; font-size:17px; color:var(--fg); padding:10px 2px; outline:none; letter-spacing:.05em; transition:.3s;
}
.new-form input[type=text]:focus{ border-color:var(--fg); }
.min-row{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:20px 0 22px; }
.min-chip{
  border:1px solid var(--line); background:transparent; color:var(--gray);
  padding:8px 18px; font-size:13px; letter-spacing:.1em; transition:.25s; border-radius:999px;
}
.min-chip.sel{ border-color:var(--fg); background:var(--fg); color:var(--bg); }
.min-custom{ display:flex; align-items:center; gap:6px; color:var(--gray); font-size:13px; }
.min-custom input{
  width:64px; border:1px solid var(--line); background:transparent; color:var(--fg);
  font-family:inherit; font-size:13px; padding:8px 10px; text-align:center; outline:none; border-radius:999px;
}
.min-custom input:focus{ border-color:var(--fg); }
.btn-create{ width:100%; border:1px solid var(--fg); background:transparent; color:var(--fg); padding:13px; font-size:14px; letter-spacing:.4em; transition:.3s; }
.btn-create:hover{ background:var(--fg); color:var(--bg); }

/* 回血活动卡 */
.act-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:18px; }
.act-card{
  background:var(--card); border:1px solid var(--line); padding:24px 18px 20px;
  text-align:center; transition:.35s; position:relative;
}
.act-card:hover{ transform:translateY(-4px); border-color:var(--br-accent); box-shadow:0 14px 30px -18px rgba(74,63,51,.35); }
.act-card img{ width:86px; height:86px; object-fit:cover; border-radius:50%; margin:0 auto 14px; border:1px solid var(--br-line); }
.act-card .a-name{ font-size:16px; letter-spacing:.15em; margin-bottom:6px; }
.act-card .a-min{ font-size:12px; color:var(--gray); letter-spacing:.12em; margin-bottom:14px; }
.act-card .a-del{ position:absolute; top:8px; right:8px; border:none; background:none; color:var(--br-gray); font-size:14px; opacity:0; transition:.3s; }
.act-card:hover .a-del{ opacity:1; }
.act-card .a-del:hover{ color:#b04a3a; }

/* 今日已完成 */
.done-list{ display:flex; flex-wrap:wrap; gap:10px; }
.done-chip{
  border:1px solid var(--line); color:var(--gray); font-size:12px; letter-spacing:.1em;
  padding:7px 14px; border-radius:999px; background:var(--card);
}
.done-chip b{ color:var(--fg); font-weight:500; }

/* 提醒 */
.setup-block{ text-align:left; margin-bottom:20px; }
.setup-label{ font-size:12px; letter-spacing:.3em; color:var(--gray); margin-bottom:12px; }
.rep-badge{
  display:inline-block; margin-left:8px; font-size:11px; border:1px solid var(--br-line);
  color:var(--br-gray); border-radius:999px; padding:2px 10px; letter-spacing:.1em; vertical-align:2px;
}
.line-head .steam{ display:block; left:auto; right:64px; bottom:-6px; transform:none; }
.steam{ z-index:3; }

/* ============ 倒计时页 ============ */
#view-timer{ padding:0; display:none; }
#view-timer.active{ display:flex; flex-direction:column; min-height:100vh; position:relative; overflow:hidden; }
.timer-bg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
body.line-ink .timer-bg{ filter:grayscale(1); opacity:.35; }
body.line-bread .timer-bg{ opacity:.16; }
#snowCanvas{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; display:none; z-index:60; }
.timer-center{
  position:relative; z-index:3; flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center; padding:80px 20px 40px; text-align:center;
}
.timer-tag{ font-size:12px; letter-spacing:.5em; color:var(--gray); margin-bottom:20px; }
.timer-name{ font-size:26px; letter-spacing:.2em; font-weight:500; margin-bottom:44px; max-width:80vw; }
.ring-wrap{ position:relative; width:min(320px,72vw); height:min(320px,72vw); }
.ring-wrap svg{ width:100%; height:100%; transform:rotate(-90deg); }
.ring-bg{ fill:none; stroke:var(--line); stroke-width:1.5; }
.ring-fg{ fill:none; stroke:var(--fg); stroke-width:2.5; stroke-linecap:round; transition:stroke-dashoffset .3s linear; }
.timer-time{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.timer-time .num{ font-size:clamp(52px,11vw,76px); font-weight:300; letter-spacing:.06em; font-variant-numeric:tabular-nums; }
.timer-time .st{ font-size:12px; letter-spacing:.4em; color:var(--gray); margin-top:10px; }
.timer-ctrls{ display:flex; gap:14px; margin-top:48px; }
.btn-ghost{
  border:1px solid var(--line); background:transparent; color:var(--gray);
  padding:12px 30px; font-size:13px; letter-spacing:.25em; transition:.3s; border-radius:999px;
}
.btn-ghost:hover{ border-color:var(--fg); color:var(--fg); }
.btn-solid{
  border:1px solid var(--fg); background:var(--fg); color:var(--bg);
  padding:12px 40px; font-size:13px; letter-spacing:.25em; transition:.3s; border-radius:999px;
}
.btn-solid:hover{ opacity:.8; }
/* 面包蒸汽 */
.steam{ position:absolute; left:50%; bottom:18%; width:120px; height:120px; transform:translateX(-50%); pointer-events:none; display:none; z-index:2; }
body.line-bread .steam{ display:block; }
.steam i{
  position:absolute; bottom:0; width:14px; height:44px; border-radius:50%;
  background:radial-gradient(ellipse at center, rgba(190,170,140,.35), transparent 70%);
  filter:blur(4px); animation:rise 3.4s infinite ease-in;
}
.steam i:nth-child(1){ left:26px; animation-delay:0s; }
.steam i:nth-child(2){ left:54px; animation-delay:1.1s; }
.steam i:nth-child(3){ left:82px; animation-delay:2.2s; }
@keyframes rise{ 0%{ transform:translateY(0) scale(1); opacity:0;} 25%{opacity:.9;} 100%{ transform:translateY(-120px) scale(1.8); opacity:0;} }

/* ============ 弹窗 ============ */
.modal-mask{
  position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center;
  background:rgba(0,0,0,.35); backdrop-filter:blur(6px); animation:fadeIn .35s;
}
.modal-mask.show{ display:flex; }
.modal{
  background:var(--card); border:1px solid var(--line); padding:52px 44px; text-align:center;
  max-width:420px; width:88vw; animation:pop .45s cubic-bezier(.22,1.4,.36,1);
}
@keyframes pop{ from{ transform:scale(.85); opacity:0;} to{ transform:none; opacity:1;} }
.modal .m-emoji{ font-size:40px; margin-bottom:18px; }
.modal .m-title{ font-size:22px; letter-spacing:.2em; margin-bottom:12px; font-weight:500; }
.modal .m-desc{ color:var(--gray); font-size:13px; letter-spacing:.1em; line-height:2; margin-bottom:32px; }
.modal .m-btns{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }

/* toast */
#toast{
  position:fixed; left:50%; bottom:36px; transform:translateX(-50%) translateY(20px);
  background:var(--fg); color:var(--bg); font-size:13px; letter-spacing:.15em;
  padding:12px 26px; border-radius:999px; opacity:0; transition:.4s; z-index:200; pointer-events:none;
}
#toast.show{ opacity:.94; transform:translateX(-50%); }

@media (max-width:760px){
  .home-split{ flex-direction:column; }
  .home-card{ min-height:50vh; padding:36px 28px; }
  .home-card .zh{ font-size:38px; }
  .line-head .head-img{ width:100%; opacity:.25; }
  .timer-ctrls{ flex-wrap:wrap; justify-content:center; }
}
</style>
</head>
<body class="line-none">

<header id="topbar">
  <div class="brand" id="brandHome">开卷 · 回血</div>
  <button id="muteBtn" title="音乐开关">♪</button>
</header>

<canvas id="snowCanvas"></canvas>

<!-- 入口页 -->
<section id="view-home" class="view active">
  <div class="home-split">
    <button class="home-card ink" data-line="study">
      <img class="bg" alt="紫禁城大雪">
      <div class="shade"></div>
      <div class="inner">
        <div class="zh">开 卷</div>
        <div class="en">GRIND MODE</div>
        <div class="desc">大雪纷飞的紫禁城，只有你一个人。<br>坐下来，把这一页啃完。</div>
      </div>
      <div class="arrow">→</div>
    </button>
    <button class="home-card bread" data-line="recharge">
      <img class="bg" alt="小人吃欧包">
      <div class="shade"></div>
      <div class="inner">
        <div class="zh">回 血</div>
        <div class="en">RECHARGE MODE</div>
        <div class="desc">喝大水、睡大觉、练薄肌、炫大饭。<br>先吃口欧包，再满血复活。</div>
      </div>
      <div class="arrow">→</div>
    </button>
  </div>
  <div class="home-foot">NORDIC · 北 京 × 欧 包</div>
</section>

<!-- 开卷 · 任务列表 -->
<section id="view-study" class="view">
  <div class="wrap">
    <button class="back-link" data-back>← 回到入口</button>
    <div class="line-head">
      <img class="head-img" id="studyHeadImg" alt="">
      <h2>开 卷</h2>
      <p>紫禁城 · 大雪 · 独行 · 寒窗</p>
    </div>

    <div class="section-label">新 建 任 务</div>
    <div class="new-form">
      <input type="text" id="taskName" maxlength="24" placeholder="想学点什么？如：背英语单词 / 啃高数第三章">
      <div class="min-row" id="studyMinRow">
        <button class="min-chip" data-min="15">15 分钟</button>
        <button class="min-chip sel" data-min="25">25 分钟</button>
        <button class="min-chip" data-min="45">45 分钟</button>
        <button class="min-chip" data-min="60">60 分钟</button>
        <div class="min-custom"><input type="number" id="studyCustomMin" min="1" max="480" placeholder="自定义"> 分钟</div>
      </div>
      <button class="btn-create" id="btnAddTask">落 笔 入 卷</button>
    </div>

    <div class="section-label">待 办 任 务</div>
    <div id="taskList"></div>

    <div class="section-label">今 日 已 完 成</div>
    <div class="done-list" id="studyDone"></div>
  </div>
</section>

<!-- 回血 · 活动选择 -->
<section id="view-recharge" class="view">
  <div class="wrap">
    <button class="back-link" data-back>← 回到入口</button>
    <div class="line-head">
      <img class="head-img" id="rechargeHeadImg" alt="">
      <div class="steam"><i></i><i></i><i></i></div>
      <h2>回 血</h2>
      <p>欧包 · 热气 · 松弛 · 到点喊你</p>
    </div>

    <div class="section-label">选 个 姿 势 回 血</div>
    <div class="act-grid" id="actGrid"></div>

    <div class="section-label">待 触 发 提 醒</div>
    <div id="remindList"></div>

    <div class="section-label">自 定 义 回 血</div>
    <div class="new-form">
      <input type="text" id="actName" maxlength="24" placeholder="想被提醒干点什么？如：发呆 / 散步 / 撸猫">
      <button class="btn-create" id="btnAddAct" style="margin-top:22px;">加 入 血 包</button>
    </div>

    <div class="section-label">今 日 已 回 过</div>
    <div class="done-list" id="rechargeDone"></div>
  </div>
</section>

<!-- 倒计时页 -->
<section id="view-timer" class="view">
  <img class="timer-bg" id="timerBg" alt="">
  <div class="steam"><i></i><i></i><i></i></div>
  <div class="timer-center">
    <div class="timer-tag" id="timerTag">开卷进行中</div>
    <div class="timer-name" id="timerName">—</div>
    <div class="ring-wrap">
      <svg viewBox="0 0 100 100">
        <circle class="ring-bg" cx="50" cy="50" r="47"></circle>
        <circle class="ring-fg" id="ringFg" cx="50" cy="50" r="47"></circle>
      </svg>
      <div class="timer-time">
        <div class="num" id="timeNum">00:00</div>
        <div class="st" id="timeState">专注中</div>
      </div>
    </div>
    <div class="timer-ctrls">
      <button class="btn-solid" id="btnPause">暂 停</button>
      <button class="btn-ghost" id="btnQuit">提前结束</button>
    </div>
  </div>
</section>

<!-- 完成弹窗 -->
<div class="modal-mask" id="doneModal">
  <div class="modal">
    <div class="m-emoji" id="doneEmoji">❄</div>
    <div class="m-title" id="doneTitle">本卷已毕</div>
    <div class="m-desc" id="doneDesc"></div>
    <div class="m-btns">
      <button class="btn-solid" id="doneAgain">再来一轮</button>
      <button class="btn-ghost" id="doneBack">返回列表</button>
    </div>
  </div>
</div>

<!-- 确认弹窗 -->
<div class="modal-mask" id="confirmModal">
  <div class="modal">
    <div class="m-title" id="cfTitle" style="font-size:18px;">确认</div>
    <div class="m-desc" id="cfDesc"></div>
    <div class="m-btns">
      <button class="btn-solid" id="cfOk">确 定</button>
      <button class="btn-ghost" id="cfNo">再想想</button>
    </div>
  </div>
</div>

<!-- 提醒设定弹窗 -->
<div class="modal-mask" id="setupModal">
  <div class="modal">
    <div class="m-title" id="setupName" style="font-size:20px;">喝大水</div>
    <div class="m-desc" id="setupTip"></div>
    <div class="setup-block">
      <div class="setup-label">多 少 分 钟 后 提 醒</div>
      <div class="min-row" id="setupMinRow" style="margin:0;">
        <button class="min-chip" data-min="5">5 分钟</button>
        <button class="min-chip sel" data-min="10">10 分钟</button>
        <button class="min-chip" data-min="20">20 分钟</button>
        <button class="min-chip" data-min="30">30 分钟</button>
        <div class="min-custom"><input type="number" id="setupCustomMin" min="1" max="480" placeholder="自定义"> 分钟</div>
      </div>
    </div>
    <div class="setup-block">
      <div class="setup-label">循 环</div>
      <div class="min-row" id="setupRepRow" style="margin:0;">
        <button class="min-chip sel" data-rep="0">仅一次</button>
        <button class="min-chip" data-rep="30">每 30 分钟</button>
        <button class="min-chip" data-rep="60">每 60 分钟</button>
      </div>
    </div>
    <div class="m-btns" style="margin-top:28px;">
      <button class="btn-solid" id="setupOk">设 定 提 醒</button>
      <button class="btn-ghost" id="setupNo">取 消</button>
    </div>
  </div>
</div>

<!-- 到点提醒弹窗 -->
<div class="modal-mask" id="remindModal">
  <div class="modal">
    <div class="m-emoji" id="rmEmoji">🍞</div>
    <div class="m-title" id="rmTitle">该回血了</div>
    <div class="m-desc" id="rmDesc"></div>
    <div class="m-btns"><button class="btn-solid" id="rmOk">收 到</button></div>
  </div>
</div>

<script>
/* ================= 图片（AI 生成） ================= */
const t2i = (p, size) => 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=' + encodeURIComponent(p) + '&image_size=' + size;

  breadHero: t2i('Cute hand-drawn doodle cartoon meme, a little person with huge wide open mouth about to eat a big European bread loaf, simple black ink line sketch, flat cream beige background, playful, minimal, funny', 'square'),
  water: t2i('Cute hand-drawn doodle cartoon, little person tilting head back drinking from a huge tall glass of water, simple black ink line sketch, cream beige background, playful minimal', 'square'),
  sleep: t2i('Cute hand-drawn doodle cartoon, little person sleeping curled up under a big soft blanket on pillow, zzz symbols, simple black ink line sketch, cream beige background, cozy minimal', 'square'),

/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const todayKey = () => new Date().toISOString().slice(0,10);
const store = {
  get(k, d){ try{ const v = JSON.parse(localStorage.getItem(k)); return v==null? d : v; }catch(e){ return d; } },
  set(k, v){ localStorage.setItem(k, JSON.stringify(v)); }
};
let toastTimer = null;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);

function fmt(sec){
  sec = Math.max(0, Math.round(sec));
  const m = String(Math.floor(sec/60)).padStart(2,'0'), s = String(sec%60).padStart(2,'0');
  return m + ':' + s;
}

/* ================= 音乐引擎（Web Audio 程序生成） ================= */
const Music = {
  ctx:null, master:null, mode:null, timers:[], nodes:[],
  muted: store.get('muted', false),
  ensure(){
    if(!this.ctx){
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 1;
      this.master.connect(this.ctx.destination);
    }
    if(this.ctx.state === 'suspended') this.ctx.resume();
  },
  setMuted(m){
    this.muted = m; store.set('muted', m);
    if(this.master) this.master.gain.linearRampToValueAtTime(m?0:1, this.ctx.currentTime + .3);
    $('#muteBtn').textContent = m ? '♪̸' : '♪'; $('#muteBtn').style.opacity = m ? .4 : 1;
  },
  stopAll(){
    this.timers.forEach(t=>clearTimeout(t)); this.timers = [];
    this.nodes.forEach(n=>{ try{ n.stop ? n.stop() : n.disconnect(); }catch(e){} });
    this.nodes = [];
  },
  setMode(mode){
    if(this.mode === mode) return;
    this.ensure(); this.stopAll(); this.mode = mode;
    if(mode === 'ink') this.startInk();
    else if(mode === 'lofi') this.startLofi();
  },
  /* 开卷：古筝/钟磬冷调 + 风雪 */
  startInk(){
    const ctx = this.ctx;
    // 风噪声
    const len = ctx.sampleRate * 2, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    const noise = ctx.createBufferSource(); noise.buffer = buf; noise.loop = true;
    const nf = ctx.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value = 380; nf.Q.value = .6;
    const ng = ctx.createGain(); ng.gain.value = .028;
    const lfo = ctx.createOscillator(); lfo.frequency.value = .07;
    const lfoG = ctx.createGain(); lfoG.gain.value = 160;
    lfo.connect(lfoG); lfoG.connect(nf.frequency);
    noise.connect(nf); nf.connect(ng); ng.connect(this.master);
    noise.start(); lfo.start();
    this.nodes.push(noise, lfo, nf, ng);
    // 空间感延迟
    const delay = ctx.createDelay(1); delay.delayTime.value = .46;
    const fb = ctx.createGain(); fb.gain.value = .38;
    const wet = ctx.createGain(); wet.gain.value = .3;
    delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(this.master);
    this.nodes.push(delay, fb, wet);
    // 五声羽调（D 羽）：D F G A C
    const scale = [146.83, 174.61, 196.00, 220.00, 261.63, 293.66, 349.23];
    const pluck = () => {
      if(this.mode !== 'ink') return;
      const f = scale[Math.floor(Math.random()*scale.length)];
      const t = ctx.currentTime;
      const o1 = ctx.createOscillator(); o1.type='sine'; o1.frequency.value = f;
      const o2 = ctx.createOscillator(); o2.type='triangle'; o2.frequency.value = f*2.001;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(.16, t+.012);
      g.gain.exponentialRampToValueAtTime(.0001, t+2.8);
      const g2 = ctx.createGain(); g2.gain.value = .12;
      o1.connect(g); o2.connect(g2); g2.connect(g);
      g.connect(this.master); g.connect(delay);
      o1.start(t); o2.start(t); o1.stop(t+3); o2.stop(t+3);
      // 偶发低音
      if(Math.random() < .22){
        const b = ctx.createOscillator(); b.type='sine'; b.frequency.value = 73.42;
        const bg = ctx.createGain();
        bg.gain.setValueAtTime(0, t); bg.gain.linearRampToValueAtTime(.1, t+.5);
        bg.gain.exponentialRampToValueAtTime(.0001, t+4);
        b.connect(bg); bg.connect(this.master); b.start(t); b.stop(t+4.2);
      }
      this.timers.push(setTimeout(pluck, 2200 + Math.random()*3800));
    };
    this.timers.push(setTimeout(pluck, 600));
  },
  /* 回血：轻快 lofi */
  startLofi(){
    const ctx = this.ctx;
    const chords = [ // Am7 - Fmaj7 - Cmaj7 - G6
      [220.00, 261.63, 329.63, 392.00],
      [174.61, 220.00, 261.63, 349.23],
      [130.81, 196.00, 246.94, 329.63],
      [196.00, 246.94, 293.66, 392.00]
    ];
    const penta = [440, 523.25, 587.33, 659.25, 783.99, 880];
    let bar = 0;
    const beat = 60/84; // 84 BPM
    const tick = () => {
      if(this.mode !== 'lofi') return;
      const t = ctx.currentTime, step = bar % 8;
      if(step === 0){ // 和弦
        const ch = chords[Math.floor(bar/8) % 4];
        ch.forEach(f=>{
          const o = ctx.createOscillator(); o.type='triangle'; o.frequency.value = f;
          const g = ctx.createGain();
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(.05, t+.4);
          g.gain.linearRampToValueAtTime(.02, t+beat*7);
          g.gain.linearRampToValueAtTime(0, t+beat*8);
          o.connect(g); g.connect(this.master); o.start(t); o.stop(t+beat*8);
        });
        const b = ctx.createOscillator(); b.type='sine'; b.frequency.value = ch[0]/2;
        const bg = ctx.createGain();
        bg.gain.setValueAtTime(0, t); bg.gain.linearRampToValueAtTime(.09, t+.05);
        bg.gain.exponentialRampToValueAtTime(.0001, t+beat*3);
        b.connect(bg); bg.connect(this.master); b.start(t); b.stop(t+beat*3);
      }
      if(Math.random() < .5){ // 旋律碎音
        const f = penta[Math.floor(Math.random()*penta.length)];
        const o = ctx.createOscillator(); o.type='sine'; o.frequency.value = f;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(.08, t+.02);
        g.gain.exponentialRampToValueAtTime(.0001, t+1.1);
        o.connect(g); g.connect(this.master); o.start(t); o.stop(t+1.2);
      }
      bar++;
      this.timers.push(setTimeout(tick, beat/2*1000));
    };
    tick();
  },
  /* 到点提示音 */
  chime(){
    this.ensure();
    const ctx = this.ctx, notes = [659.25, 987.77, 1318.5];
    notes.forEach((f,i)=>{
      const t = ctx.currentTime + i*.28;
      const o = ctx.createOscillator(); o.type='sine'; o.frequency.value = f;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.22, t+.01);
      g.gain.exponentialRampToValueAtTime(.0001, t+1.8);
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t+2);
    });
  }
};

/* ================= 雪花动画 ================= */
const snowC = $('#snowCanvas'), sctx = snowC.getContext('2d');
let flakes = [], snowOn = false, snowRAF = null;
function sizeSnow(){ snowC.width = innerWidth; snowC.height = innerHeight; }
addEventListener('resize', sizeSnow); sizeSnow();
for(let i=0;i<140;i++) flakes.push({ x:Math.random()*innerWidth, y:Math.random()*innerHeight, r:.8+Math.random()*2.4, vy:.4+Math.random()*1.2, vx:-.4+Math.random()*.8, o:.3+Math.random()*.6 });
function snowLoop(){
  if(!snowOn) return;
  sctx.clearRect(0,0,snowC.width,snowC.height);
  sctx.fillStyle = '#fff';
  flakes.forEach(f=>{
    sctx.globalAlpha = f.o;
    sctx.beginPath(); sctx.arc(f.x, f.y, f.r, 0, 7); sctx.fill();
    f.y += f.vy; f.x += f.vx + Math.sin(f.y*.01)*.3;
    if(f.y > snowC.height+5){ f.y = -5; f.x = Math.random()*snowC.width; }
    if(f.x > snowC.width+5) f.x = -5; if(f.x < -5) f.x = snowC.width+5;
  });
  snowRAF = requestAnimationFrame(snowLoop);
}
function toggleSnow(){
  const should = document.body.className === 'line-ink' && (currentView==='timer' || currentView==='study');
  snowC.style.display = should ? 'block' : 'none';
  if(should && !snowOn){ snowOn = true; snowLoop(); }
  else if(!should && snowOn){ snowOn = false; cancelAnimationFrame(snowRAF); sctx.clearRect(0,0,snowC.width,snowC.height); }
}

function renderDone(){

}
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* 时长 chip 选择 */
function bindMinRow(rowSel, inputSel){
  const row = $(rowSel);
  row.addEventListener('click', e=>{
    const chip = e.target.closest('.min-chip'); if(!chip) return;
    row.querySelectorAll('.min-chip').forEach(c=>c.classList.remove('sel'));
    chip.classList.add('sel'); $(inputSel).value = '';
  });
  $(inputSel).addEventListener('input', ()=>row.querySelectorAll('.min-chip').forEach(c=>c.classList.remove('sel')));
}
function pickMinutes(rowSel, inputSel, fallback){
  const v = parseInt($(inputSel).value);
  if(v > 0) return Math.min(v, 480);
  const sel = $(rowSel + ' .min-chip.sel');
  return sel ? +sel.dataset.min : fallback;
}
bindMinRow('#studyMinRow', '#studyCustomMin');
bindMinRow('#setupMinRow', '#setupCustomMin');
document.querySelector('#setupRepRow').addEventListener('click', e=>{

});

document.addEventListener('click', e=>{
  const dt = e.target.closest('[data-del-task]');
  if(dt){ tasks = tasks.filter(t=>t.id != dt.dataset.delTask); store.set('tasks', tasks); renderTasks(); return; }
  const da = e.target.closest('[data-del-act]');
  if(da){ customs = customs.filter(c=>c.id != da.dataset.delAct); store.set('customActs', customs); renderActs(); return; }
  const dr = e.target.closest('[data-del-remind]');
  if(dr){ reminders = reminders.filter(r=>r.id != dr.dataset.delRemind); store.set('reminders', reminders); renderReminders(); toast('提醒已撤下'); return; }
  const st = e.target.closest('[data-start-task]');
  if(st){ const t = tasks.find(x=>x.id == st.dataset.startTask); if(t) tryStart({ line:'study', name:t.name, minutes:t.minutes }); return; }
  const su = e.target.closest('[data-setup]');
  if(su){
    const key = su.dataset.setup;
    const p = PRESETS.find(x=>x.key===key);
    const c = p ? null : customs.find(x=>'c'+x.id === key);
    const name = p ? p.name : (c ? c.name : null);
    if(!name) return;
    openSetup(name);
  }
});

function fireReminder(r){
  firing = r;
  Music.ensure(); Music.chime();
  const emoji = { '喝大水':'💧', '睡大觉':'😴', '练薄肌':'💪', '炫大饭':'🍞' }[r.name] || '🍞';
  $('#rmEmoji').textContent = emoji;
  $('#rmTitle').textContent = '该 ' + r.name + ' 了';
  $('#rmDesc').textContent = '先放下手里的事，回一口血。' + (r.rep ? '（此提醒每 ' + r.rep + ' 分钟循环）' : '');

$('#rmOk').addEventListener('click', ()=>{
  if(firing){
    const t = new Date();
    const hh = String(t.getHours()).padStart(2,'0'), mm = String(t.getMinutes()).padStart(2,'0');
    doneData.items.push({ line:'recharge', name:firing.name, minutes:firing.minutes, time:hh+':'+mm });
    store.set('doneToday', doneData); renderDone();
    if(firing.rep) firing.fireAt = Date.now() + firing.rep*60000;
    else reminders = reminders.filter(x=>x.id !== firing.id);
    store.set('reminders', reminders); renderReminders();
    firing = null;
  }

/* 每秒检查：刷新剩余时间 + 触发到点提醒 */
setInterval(()=>{
  const now = Date.now();
  document.querySelectorAll('[data-left]').forEach(el=>{
    const r = reminders.find(x=>x.id == el.dataset.left);
    if(r) el.textContent = fmt(Math.max(0, r.fireAt - now)/1000) + ' 后';
  });
  if(!$('#remindModal').classList.contains('show')){
    const due = reminders.find(r=>r.fireAt <= now);
    if(due) fireReminder(due);
  }
}, 1000);

/* ================= 倒计时引擎 ================= */
const Timer = {
  active: null, iv: null,
  RING_LEN: 2 * Math.PI * 47,
  tryStartRef: null
};
function tryStart(plan){
  if(Timer.active){
    confirmBox('已有进行中', '「' + Timer.active.name + '」还在倒计时，要结束它并开始「' + plan.name + '」吗？', ()=>{
      clearActive(false); startTimer(plan);
    });
  } else startTimer(plan);
}
function startTimer(plan){
  const now = Date.now();
  Timer.active = {
    line: plan.line, name: plan.name, minutes: plan.minutes,
    durationMs: plan.minutes * 60000,
    endsAt: now + plan.minutes * 60000,
    remainingMs: plan.minutes * 60000,
    paused: false
  };
  store.set('activeTimer', Timer.active);
  enterTimerView();
  toast(plan.line==='study' ? '开卷 · 雪落无声' : '回血 · 热气升腾');
}
function enterTimerView(){
  const a = Timer.active; if(!a) return;
  $('#timerBg').src = a.line==='study' ? IMG.inkBg : IMG.breadHero;
  $('#timerTag').textContent = a.line==='study' ? '开 卷 进 行 中' : '回 血 进 行 中';
  $('#timerName').textContent = a.name;
  $('#timeState').textContent = a.paused ? '已暂停' : (a.line==='study' ? '专注中' : '松弛中');
  $('#btnPause').textContent = a.paused ? '继 续' : '暂 停';
  $('#ringFg').style.strokeDasharray = Timer.RING_LEN;
  show('timer');
  clearInterval(Timer.iv);
  Timer.iv = setInterval(tick, 250);
  tick();
}
function tick(){
  const a = Timer.active; if(!a){ clearInterval(Timer.iv); return; }
  if(!a.paused) a.remainingMs = a.endsAt - Date.now();
  const sec = a.remainingMs / 1000;
  $('#timeNum').textContent = fmt(sec);
  const ratio = Math.max(0, a.remainingMs / a.durationMs);
  $('#ringFg').style.strokeDashoffset = Timer.RING_LEN * (1 - ratio);
  document.title = fmt(sec) + ' · ' + a.name;
  if(a.remainingMs <= 0) completeTimer();
}
function completeTimer(){
  const a = Timer.active; if(!a) return;
  const time = new Date();
  const hh = String(time.getHours()).padStart(2,'0'), mm = String(time.getMinutes()).padStart(2,'0');
  doneData.items.push({ line:a.line, name:a.name, minutes:a.minutes, time:hh+':'+mm });
  store.set('doneToday', doneData);
  const last = { line:a.line, name:a.name, minutes:a.minutes };
  clearActive(false);
  Music.chime();
  renderDone();
  // 完成弹窗
  if(last.line==='study'){
    $('#doneEmoji').textContent = '❄';
    $('#doneTitle').textContent = '本 卷 已 毕';
    $('#doneDesc').textContent = '「' + last.name + '」' + last.minutes + ' 分钟已完成。紫禁城的雪还在下，而你又往前走了一步。';
  }else{
    $('#doneEmoji').textContent = '🍞';
    $('#doneTitle').textContent = '回 血 完 成';
    $('#doneDesc').textContent = '「' + last.name + '」' + last.minutes + ' 分钟到账。血条回满，可以继续浪了。';
  }
  Timer.tryStartRef = last;
  $('#doneModal').classList.add('show');
  document.title = '开卷 · 回血';
}
function clearActive(toastIt){
  Timer.active = null;
  localStorage.removeItem('activeTimer');
  clearInterval(Timer.iv);
  document.title = '开卷 · 回血';
  if(toastIt) toast('已结束');
}
$('#btnPause').addEventListener('click', ()=>{
  const a = Timer.active; if(!a) return;
  if(a.paused){ a.paused = false; a.endsAt = Date.now() + a.remainingMs; }
  else { a.paused = true; a.remainingMs = a.endsAt - Date.now(); }
  store.set('activeTimer', a);
  $('#timeState').textContent = a.paused ? '已暂停' : (a.line==='study' ? '专注中' : '松弛中');
  $('#btnPause').textContent = a.paused ? '继 续' : '暂 停';
  tick();
});
$('#btnQuit').addEventListener('click', ()=>{
  confirmBox('提前结束', '「' + Timer.active.name + '」还没倒完，确定要提前结束吗？（不计入已完成）', ()=>{
    const line = Timer.active.line;
    clearActive(true);
    show(line==='study' ? 'study' : 'recharge');
  });
});
$('#doneAgain').addEventListener('click', ()=>{
  $('#doneModal').classList.remove('show');
  if(Timer.tryStartRef) startTimer(Timer.tryStartRef);
});
$('#doneBack').addEventListener('click', ()=>{
  $('#doneModal').classList.remove('show');
  const line = Timer.tryStartRef ? Timer.tryStartRef.line : 'study';
  show(line==='study' ? 'study' : 'recharge');
});

/* ================= 初始化 & 断点恢复 ================= */
renderTasks(); renderActs(); renderReminders(); renderDone();
(function restore(){
  const a = store.get('activeTimer', null);
  if(!a) return;
  if(a.paused){ Timer.active = a; enterTimerView(); return; }
  if(a.endsAt > Date.now()){ Timer.active = a; enterTimerView(); }
  else { Timer.active = a; a.remainingMs = 0; completeTimer(); }
})();
show(currentView === 'home' && Timer.active ? 'timer' : currentView);
</script>
</body>
</html>
